[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "fire>=0.6",
    "numpy>=1.26",
    "pydantic>=2.8",
    "torch>=2.2",
    "tqdm>=4.66",
    "transformers>=4.51",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = [
    "flake8>=7.0",
    "mypy>=1.10",
    "pytest>=8.0",
]

[tool.mypy]
exclude = ["^data/", "^mouilinette/", "^\\.venv/"]

[[tool.mypy.overrides]]
module = ["fire", "fire.*", "tqdm", "tqdm.*"]
ignore_missing_imports = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
